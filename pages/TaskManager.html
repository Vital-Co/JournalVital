<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskManager</title>
<link rel="stylesheet" href="../css/Shared.css">
  <link rel="icon" type="image/png" href="../favicon.png">
<script src="../i18n/i18n.js"></script>
<script>
  (function () {
    try {
      var t = localStorage.getItem('vital_theme');
      if (t && t !== 'light') {
        document.documentElement.setAttribute('data-theme', t);
      }
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="../css/TaskManager.css">
</head>
<body>

<div class="app">
  <header class="header">
    <div class="header-left">
      <a href="../Index.html" class="btn-tools" data-i18n-title="common.back_to_tools_title" data-i18n="common.back_to_tools">Mes outils</a>
      <div class="header-title-wrap">
        <div class="header-title" id="header-title-main">TaskManager</div>
      </div>
    </div>
    <div class="header-right">
      <div class="lang-switcher" role="group" aria-label="Langue / Language">
        <button type="button" class="lang-btn" data-lang="fr" title="Français">FR</button>
        <button type="button" class="lang-btn" data-lang="eng" title="English">EN</button>
        <button type="button" class="lang-btn" data-lang="es" title="Español">ES</button>
      </div>
      <div class="theme-switcher" role="group" data-i18n-aria-label="common.theme_chooser_aria">
        <span class="theme-label" data-i18n="common.theme_chooser_label">Choisis ta couleur...</span>
        <button type="button" class="theme-dot theme-dot-light" data-theme="light" data-i18n-aria-label="common.theme_light" data-i18n-title="common.theme_light"></button>
        <button type="button" class="theme-dot theme-dot-green" data-theme="green" data-i18n-aria-label="common.theme_green" data-i18n-title="common.theme_green"></button>
        <button type="button" class="theme-dot theme-dot-blue" data-theme="blue" data-i18n-aria-label="common.theme_blue" data-i18n-title="common.theme_blue"></button>
        <button type="button" class="theme-dot theme-dot-orange" data-theme="orange" data-i18n-aria-label="common.theme_orange" data-i18n-title="common.theme_orange"></button>
        <button type="button" class="theme-dot theme-dot-rose" data-theme="rose" data-i18n-aria-label="common.theme_rose" data-i18n-title="common.theme_rose"></button>
        <button type="button" class="theme-dot theme-dot-dark" data-theme="dark" data-i18n-aria-label="common.theme_dark" data-i18n-title="common.theme_dark"></button>
      </div>
      <div class="header-meta" id="today-date"></div>
    </div>
  </header>

  <div class="main-content">
  </div><!-- /.main-content -->
</div>

<p class="idx-footer" data-i18n="index.footer_license">© 2026 Vital C. — Code source disponible sous licence MIT. </p>
<p class="idx-footer"> <a href="https://github.com/Vital-Co/JournalVital" target="Sur GitHub">GitHub</a></p>

<script src="../js/Common.js"></script>
<script src="../js/TaskManager.js"></script>
</body>
</html>
